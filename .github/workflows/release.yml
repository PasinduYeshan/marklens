name: Release

# Push a tag like v0.2.0 (matching package.json) to build the VSIX, attach it to a
# GitHub release, and publish to the VS Code Marketplace and Open VSX when their
# tokens are configured as repository secrets (VSCE_PAT, OVSX_PAT).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          cat notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.vsix --title "MarkLens ${GITHUB_REF_NAME}" --notes-file notes.md
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath ./*.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish ./*.vsix -p "$OVSX_PAT"
